# Prod is deployed by publishing a release on main by hand, see README.md.
# base-image-refresh.yml also starts this weekly on the newest release's tag, to rebuild it on a fresh base image.
name: Deploy to prod
on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  build:
    # Dispatching on a branch would put unreleased code in prod, so only tags are allowed.
    if: >-
      (github.event_name == 'release' && github.event.release.target_commitish == 'main') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/'))
    uses: navikt/navno-ci/.github/workflows/jvm-build.yml@v1
    permissions: { contents: read, id-token: write, packages: read }
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: prod-gcp
      resource: .nais/nais.yaml
      vars: .nais/prod-gcp/navno.json
      workload-image: ${{ needs.build.outputs.image }}
